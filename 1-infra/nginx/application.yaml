apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: nginx-ingress
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://github.com/$GITHUB_USER/home-lab.git
        targetRevision: HEAD
        path: charts/nginx-ingress
    destination:
        server: https://kubernetes.default.svc
        namespace: ingress-nginx
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
